<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="662" viewBox="0 0 1280 662" font-family="Segoe UI"><rect width="1280" height="662" fill="#f6f7fb"/><text x="36" y="48" font-size="30" font-weight="700" fill="#14213d">The Nine Checks — Does Release Radar Deserve to Be Built?</text><text x="36" y="78" font-size="15" fill="#4a5568">Open Source Release Radar · a weekly, AI-triaged digest of GitHub releases for a senior fintech engineer (Keerthi)</text><rect x="1094" y="26" width="150" height="40" rx="20" fill="#1e6b3a"/><text x="1169" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">9 / 9 · Build it</text><rect x="36" y="116" width="388" height="366" rx="14" fill="#fff" stroke="#e2a3a3" stroke-width="1.5"/><path d="M36 130a14 14 0 0 1 14 -14H410a14 14 0 0 1 14 14V192H36Z" fill="#fdecec"/><polygon points="63,138 75,138 84,147 84,159 75,168 63,168 54,159 54,147" fill="#b42318"/><rect x="61" y="151" width="16" height="4" rx="2" fill="#fff"/><text x="98" y="152" font-size="21" font-weight="700" fill="#b42318">Kill switches</text><text x="98" y="174" font-size="14" font-style="italic" fill="#4a5568">Any No means: don't build it.</text><text x="54" y="224" font-size="16.5" font-weight="700" fill="#14213d">01  Problem real?</text><text x="54" y="248" font-size="15" fill="#14213d"><tspan font-weight="700" fill="#1e6b3a">YES</tspan> — a senior engineer, a stack of dependencies,</text><text x="54" y="268" font-size="15" fill="#14213d">and security fixes buried in changelog noise every</text><text x="54" y="288" font-size="15" fill="#14213d">week.</text><text x="54" y="328" font-size="16.5" font-weight="700" fill="#14213d">02  Workflow repeated?</text><text x="54" y="352" font-size="15" fill="#14213d"><tspan font-weight="700" fill="#1e6b3a">YES</tspan> — every week, every repo, every release: the</text><text x="54" y="372" font-size="15" fill="#14213d">same read, sort and decide routine.</text><text x="54" y="412" font-size="16.5" font-weight="700" fill="#14213d">03  Input available?</text><text x="54" y="436" font-size="15" fill="#14213d"><tspan font-weight="700" fill="#1e6b3a">YES</tspan> — GitHub publishes release notes through a</text><text x="54" y="456" font-size="15" fill="#14213d">public API, and the repo list is Keerthi's own.</text><rect x="446" y="116" width="388" height="366" rx="14" fill="#fff" stroke="#e6c97a" stroke-width="1.5"/><path d="M446 130a14 14 0 0 1 14 -14H820a14 14 0 0 1 14 14V192H446Z" fill="#fdf3d9"/><g stroke="#92600a" stroke-width="3" fill="none" stroke-linecap="round"><path d="M479 141V165M470 165H488M467 147H491"/><path d="M467 147L463 157H471Z M491 147L487 157H495Z" stroke-width="2.5"/></g><text x="508" y="152" font-size="21" font-weight="700" fill="#92600a">Sizing</text><text x="508" y="174" font-size="14" font-style="italic" fill="#4a5568">Any No means: build something smaller.</text><text x="464" y="224" font-size="16.5" font-weight="700" fill="#14213d">04  Output valuable?</text><text x="464" y="248" font-size="15" fill="#14213d"><tspan font-weight="700" fill="#1e6b3a">YES</tspan> — a ranked board: what to act on, why, how big</text><text x="464" y="268" font-size="15" fill="#14213d">the job is, plus a ready-to-paste ticket.</text><text x="464" y="308" font-size="16.5" font-weight="700" fill="#14213d">05  Impact measurable?</text><text x="464" y="332" font-size="15" fill="#14213d"><tspan font-weight="700" fill="#1e6b3a">YES</tspan> — time to triage, alert latency from publish to</text><text x="464" y="352" font-size="15" fill="#14213d">email, and how often Gemini has to be corrected.</text><text x="464" y="392" font-size="16.5" font-weight="700" fill="#14213d">08  ROI worth it?</text><text x="464" y="416" font-size="15" fill="#14213d"><tspan font-weight="700" fill="#1e6b3a">YES</tspan> — hours to build, free tiers throughout, a</text><text x="464" y="436" font-size="15" fill="#14213d">Flash-class model, and it runs weekly with nobody</text><text x="464" y="456" font-size="15" fill="#14213d">watching.</text><rect x="856" y="116" width="388" height="366" rx="14" fill="#fff" stroke="#9fd0ae" stroke-width="1.5"/><path d="M856 130a14 14 0 0 1 14 -14H1230a14 14 0 0 1 14 14V192H856Z" fill="#e6f4ea"/><g fill="#1e6b3a"><rect x="877" y="151" width="24" height="16" rx="3"/></g><path d="M882 151V147a7 7 0 0 1 14 0V151" stroke="#1e6b3a" stroke-width="3" fill="none"/><text x="918" y="152" font-size="21" font-weight="700" fill="#1e6b3a">Boundary</text><text x="918" y="174" font-size="14" font-style="italic" fill="#4a5568">Any No means: put a human exactly here.</text><text x="874" y="224" font-size="16.5" font-weight="700" fill="#14213d">06  Failure risk OK?</text><text x="874" y="248" font-size="15" fill="#14213d"><tspan font-weight="700" fill="#1e6b3a">YES</tspan> — it only reads and advises. The worst case is a</text><text x="874" y="268" font-size="15" fill="#14213d">late decision, never a changed repo.</text><text x="874" y="308" font-size="16.5" font-weight="700" fill="#14213d">07  Judgment protected?</text><text x="874" y="332" font-size="15" fill="#14213d"><tspan font-weight="700" fill="#1e6b3a">YES</tspan> — Gemini proposes, fixed rules place the card,</text><text x="874" y="352" font-size="15" fill="#14213d">Keerthi decides.</text><text x="874" y="392" font-size="16.5" font-weight="700" fill="#14213d">09  Owner clear?</text><text x="874" y="416" font-size="15" fill="#14213d"><tspan font-weight="700" fill="#1e6b3a">YES</tspan> — Keerthi owns the repo list, the tiers and every</text><text x="874" y="436" font-size="15" fill="#14213d">final call; maintainers own the source text.</text><rect x="36" y="500" width="593" height="100" rx="12" fill="#fff" stroke="#d5d9e6" stroke-width="1.2"/><rect x="36" y="500" width="6" height="100" rx="3" fill="#b42318"/><text x="58" y="526" font-size="16" font-weight="700" fill="#14213d">“Auto-merge the patch the moment a security release lands.”</text><text x="58" y="550" font-size="14.5" font-weight="700" fill="#b42318">→ Killed by 06 + 07.</text><text x="58" y="572" font-size="14" fill="#4a5568">Changing production code is not free to undo, and the engineer must make that call. The</text><text x="58" y="591" font-size="14" fill="#4a5568">algorithm narrows; the human chooses.</text><rect x="651" y="500" width="593" height="100" rx="12" fill="#fff" stroke="#d5d9e6" stroke-width="1.2"/><rect x="651" y="500" width="6" height="100" rx="3" fill="#b42318"/><text x="673" y="526" font-size="16" font-weight="700" fill="#14213d">“Hide anything Gemini calls noise, for good.”</text><text x="673" y="550" font-size="14.5" font-weight="700" fill="#b42318">→ Killed by 07.</text><text x="673" y="572" font-size="14" fill="#4a5568">A confident model can be wrong. Archive it, show the count, let the human restore it.</text><text x="36" y="640" font-size="13" fill="#4a5568">Framework: MESA AI-Native Track, Claude Basics (slide 32). Honest gaps for each check are in the README and the study notes.</text></svg>