<text x="247.5" y="265" text-anchor="start" font-size="8.4" font-style="italic" fill="#33405f">pulled</text>
<text x="195.5" y="377" text-anchor="start" font-size="8.4" font-style="italic" fill="#33405f">pushed</text>
