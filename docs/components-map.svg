<text x="698.5" y="545" text-anchor="start" font-size="8.4" font-style="italic" fill="#33405f">analysis (JSON)</text>
<text x="698.5" y="769" text-anchor="start" font-size="8.4" font-style="italic" fill="#33405f">emergency?</text>
